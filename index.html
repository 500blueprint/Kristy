<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Momma's Bewitched Creations</title>

<style>

/* ==============================
   RESET
============================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
    overflow-x: hidden;
}


/* ==============================
   VIDEO
============================== */

.video-section {
    position: relative;
    width: 100%;
    margin: 0;
    padding: 0;
    background: #000;
}

.video-section video {
    display: block;

    width: 100%;
    height: auto;

    margin: 0;
    padding: 0;

    border: none;

    background: #000;

    object-fit: contain;
}


/* ==============================
   FALLING STARS
============================== */

.stars {
    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    pointer-events: none;
    overflow: hidden;

    z-index: 9999;
}


.star {
    position: absolute;

    top: -40px;

    color: #fff7a8;

    line-height: 1;

    text-shadow:
        0 0 4px #ffffff,
        0 0 8px #fff4a0,
        0 0 15px #ffe56b,
        0 0 25px #ffd54a;

    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}


/* ==============================
   STAR ANIMATION
============================== */

@keyframes fall {

    0% {
        transform:
            translateY(-60px)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    85% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(110vh)
            rotate(360deg);

        opacity: 0;
    }

}


/* ==============================
   MOBILE
============================== */

@media screen and (max-width: 768px) {

    .video-section {
        width: 100%;
    }

    .video-section video {
        width: 100%;
        height: auto;
    }

}

</style>

</head>


<body>


<!-- ==============================
     MOMMA'S BEWITCHED VIDEO
============================== -->

<div class="video-section">

    <video
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
        controls>

        <source
            src="https://500blueprint.github.io/Kristy/index.MP4"
            type="video/mp4">

        Your browser does not support HTML5 video.

    </video>

</div>



<!-- ==============================
     FALLING STARS
============================== -->

<div class="stars" id="stars"></div>


<script>

/* ==============================
   CREATE FALLING STARS
============================== */

const starContainer =
    document.getElementById("stars");


const symbols = [
    "✦",
    "✧",
    "★",
    "⋆"
];


for (let i = 0; i < 30; i++) {

    const star =
        document.createElement("span");


    star.className = "star";


    star.textContent =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    /* RANDOM POSITION */

    star.style.left =
        Math.random() * 100 + "vw";


    /* RANDOM SIZE */

    star.style.fontSize =
        (8 + Math.random() * 16) +
        "px";


    /* RANDOM FALL SPEED */

    star.style.animationDuration =
        (7 + Math.random() * 10) +
        "s";


    /* RANDOM START TIME */

    star.style.animationDelay =
        (-Math.random() * 15) +
        "s";


    starContainer.appendChild(star);

}

</script>


</body>

</html>
