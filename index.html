<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Mommas Bewitched Creations</title>

<style>

/* REMOVE ALL DEFAULT SPACING */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;

  background: transparent;

  overflow-x: hidden;
}


/* VIDEO WRAPPER */

#mommas-bewitched {
  position: relative;

  width: 100%;

  margin: 0;
  padding: 0;

  background: transparent;

  overflow: hidden;
}


/* VIDEO */

#mommas-video {
  display: block;

  width: 100%;
  height: auto;

  max-width: 100%;

  margin: 0;
  padding: 0;

  border: 0;

  object-fit: contain;
  object-position: center center;

  background: transparent;
}


/* MOBILE */

@media screen and (max-width: 768px) {

  #mommas-bewitched {
    width: 100%;
  }

  #mommas-video {
    width: 100%;
    height: auto;
    object-fit: contain;
  }

}

</style>

</head>


<body>


<div id="mommas-bewitched">

  <video
    id="mommas-video"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto"
  >

    <source
      src="./index.MP4"
      type="video/mp4"
    >

  </video>

</div>


<script>

const video =
  document.getElementById("mommas-video");


/* KEEP VIDEO MUTED FOR AUTOPLAY */

video.muted = true;


/* START VIDEO */

function playMommasVideo() {

  const playAttempt =
    video.play();

  if (playAttempt !== undefined) {

    playAttempt.catch(function() {

      /* iPhone may wait for first interaction */

    });

  }

}


/* PLAY WHEN READY */

video.addEventListener(
  "loadeddata",
  playMommasVideo
);

video.addEventListener(
  "canplay",
  playMommasVideo
);


/* RETRY ON FIRST TOUCH */

document.addEventListener(
  "touchstart",
  playMommasVideo,
  { once: true }
);


/* RETRY ON CLICK */

document.addEventListener(
  "click",
  playMommasVideo,
  { once: true }
);


/* RESTART IF USER RETURNS TO TAB */

document.addEventListener(
  "visibilitychange",
  function() {

    if (!document.hidden) {

      playMommasVideo();

    }

  }
);

</script>


</body>

</html>
