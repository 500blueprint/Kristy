<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Momma's Bewitched Creations</title>

<style>

/* ============================
   RESET
============================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    background: transparent;
}


/* ============================
   VIDEO AREA
============================ */

.video-container {
    position: relative;
    width: 100%;
    margin: 0 auto;
    padding: 0;
    overflow: hidden;
    background: transparent;
    line-height: 0;
}


/* VIDEO
   NO FIXED HEIGHT = NO HUGE
   BLACK SPACE UNDER VIDEO
*/

.video-container video {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
    margin: 0;
    padding: 0;
    border: none;
    background: transparent;
    object-fit: contain;
}


/* ============================
   FALLING STARS
============================ */

#stars {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    pointer-events: none;
    z-index: 999999;
}

.star {
    position: absolute;
    top: -50px;

    color: #fff8ad;

    text-shadow:
        0 0 4px #ffffff,
        0 0 8px #fff4a3,
        0 0 14px #ffe56b,
        0 0 22px #ffd447;

    animation-name: fallingStar;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}


/* ============================
   STAR FALL ANIMATION
============================ */

@keyframes fallingStar {

    0% {
        transform:
            translateY(-60px)
            rotate(0deg)
            scale(.6);

        opacity: 0;
    }

    8% {
        opacity: 1;
    }

    85% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(110vh)
            rotate(360deg)
            scale(1.1);

        opacity: 0;
    }
}


/* ============================
   MOBILE
============================ */

@media (max-width: 768px) {

    .video-container {
        width: 100%;
        height: auto;
    }

    .video-container video {
        width: 100%;
        height: auto;
        object-fit: contain;
    }

}

</style>

</head>


<body>


<!-- ==================================
     MOMMA'S BEWITCHED VIDEO
=================================== -->

<div class="video-container">

    <video
  autoplay
  muted
  loop
  playsinline
  webkit-playsinline
  preload="auto"
  style="display:block;width:100%;height:auto;"
>
  <source
    src="./index.mp4"
    type="video/mp4"
  >
</video>

</div>



<!-- ==================================
     FALLING STAR LAYER
=================================== -->

<div id="stars"></div>



<script>

/* ==================================
   VIDEO AUTOPLAY
=================================== */

const video =
    document.getElementById("mainVideo");

video.muted = true;
video.defaultMuted = true;

video.setAttribute("muted", "");
video.setAttribute("playsinline", "");
video.setAttribute("webkit-playsinline", "");


function playVideo() {

    const attempt = video.play();

    if (attempt !== undefined) {

        attempt.catch(function () {

            video.muted = true;

            video.play().catch(function () {
                /* Safari may wait for page interaction */
            });

        });

    }
}


document.addEventListener(
    "DOMContentLoaded",
    playVideo
);

window.addEventListener(
    "load",
    playVideo
);


/* ==================================
   FALLING STARS
=================================== */

const starContainer =
    document.getElementById("stars");


const starSymbols = [
    "✦",
    "✧",
    "⋆",
    "★",
    "✦"
];


const numberOfStars = 35;


for (
    let i = 0;
    i < numberOfStars;
    i++
) {

    const star =
        document.createElement("span");

    star.className = "star";


    /* RANDOM STAR */

    star.textContent =
        starSymbols[
            Math.floor(
                Math.random() *
                starSymbols.length
            )
        ];


    /* RANDOM LEFT POSITION */

    star.style.left =
        Math.random() * 100 + "vw";


    /* RANDOM SIZE */

    star.style.fontSize =
        (
            8 +
            Math.random() * 17
        ) + "px";


    /* RANDOM FALL SPEED */

    star.style.animationDuration =
        (
            6 +
            Math.random() * 10
        ) + "s";


    /* STAGGER STARS */

    star.style.animationDelay =
        (
            -Math.random() * 15
        ) + "s";


    starContainer.appendChild(star);

}


/* ==================================
   TRY AGAIN AFTER USER TOUCH
   HELPS WITH MOBILE SAFARI
=================================== */

document.addEventListener(
    "touchstart",
    function () {

        if (video.paused) {
            playVideo();
        }

    },
    { once: true }
);

</script>


</body>

</html>
