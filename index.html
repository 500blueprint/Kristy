<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mommas Bewitched Creations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    .mommas-bewitched {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    .mommas-bewitched video {
      position: absolute;
      width: 100%;
      height: 100%;
      inset: 0;

      object-fit: cover;
      object-position: center;

      border: 0;
    }

    /* subtle dark overlay for richer witchy look */
    .mommas-bewitched::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 45%,
          rgba(0,0,0,.22) 100%
        );
    }
  </style>
</head>

<body>

  <div class="mommas-bewitched">

    <video
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    >
      <source src="Tumblercat.mp4" type="video/mp4">

      Your browser does not support video.
    </video>

  </div>

</body>
</html>
