<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Momma's Bewitched Creations</title>

<style>

/* RESET */
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  background: #000;
  overflow-x: hidden;
}


/* ==============================
   VIDEO
============================== */

.video-wrap {
  position: relative;
  width: 100%;
  margin: 0;
  padding: 0;
  background: #000;
  overflow: hidden;
}

.video-wrap video {
  display: block;

  width: 100%;
  height: auto;

  margin: 0;
  padding: 0;

  border: 0;

  object-fit: contain;

  background: #000;
}


/* ==============================
   FALLING STARS
============================== */

#stars {
  position: fixed;

  inset: 0;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  pointer-events: none;

  z-index: 9999;
}


.star {
  position: absolute;

  top: -40px;

  color: #fff7a8;

  line-height: 1;

  text-shadow:
    0 0 4px #fff,
    0 0 8px #fff4a0,
    0 0 15px #ffe66d,
    0 0 25px #ffd84d;

  animation:
    fall linear infinite,
    twinkle ease-in-out infinite alternate;
}


@keyframes fall {

  0% {
    transform:
      translateY(-60px)
      rotate(0deg);

    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  85% {
    opacity: 1;
  }

  100% {
    transform:
      translateY(110vh)
      rotate(360deg);

    opacity: 0;
  }

}


@keyframes twinkle {

  from {
    filter: brightness(.8);
  }

  to {
    filter: brightness(1.8);
  }

}


/* ==============================
   PHONE
============================== */

@media screen and (max-width: 768px) {

  .video-wrap {
    width: 100%;
  }

  .video-wrap video {
    width: 100%;
    height: auto;
  }

}

</style>

</head>


<body>


<!-- ==============================
     VIDEO
============================== -->

<div class="video-wrap">

  <video
    id="mainVideo"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="metadata"
    controls
  >

    <source
      src="https://500blueprint.github.io/Kristy/index.MP4"
      type="video/mp4"
    >

    Your browser does not support HTML5 video.

  </video>

</div>



<!-- ==============================
     FALLING STARS
============================== -->

<div id="stars"></div>



<script>

/* ==============================
   STARS
============================== */

const stars =
  document.getElementById("stars");


const symbols = [
  "✦",
  "✧",
  "⋆",
  "★"
];


for (let i = 0; i < 28; i++) {

  const star =
    document.createElement("span");


  star.className = "star";


  star.textContent =
    symbols[
      Math.floor(
        Math.random() *
        symbols.length
      )
    ];


  star.style.left =
    Math.random() * 100 + "vw";


  star.style.fontSize =
    (8 + Math.random() * 16) +
    "px";


  star.style.animationDuration =
    (7 + Math.random() * 9) +
    "s, " +
    (1 + Math.random() * 2) +
    "s";


  star.style.animationDelay =
    (-Math.random() * 14) +
    "s, " +
    (-Math.random() * 2) +
    "s";


  stars.appendChild(star);

}


/* ==============================
   AUTOPLAY BACKUP
============================== */

const video =
  document.getElementById("mainVideo");


video.muted = true;


window.addEventListener(
  "load",
  function() {

    video.play().catch(function() {

      /* Controls remain visible
         if iPhone blocks autoplay */

    });

  }
);

</script>


</body>
</html>
