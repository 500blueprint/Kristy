<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Mommas Bewitched Creations</title>

<style>

/* =========================
   RESET
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  background: #000;

  overflow: hidden;
}


/* =========================
   MAIN CONTAINER
========================= */

.mommas-bewitched {

  position: fixed;

  top: 0;
  left: 0;

  width: 100%;
  height: 100vh;
  height: 100dvh;

  overflow: hidden;

  background: #000;
}


/* =========================
   VIDEO
========================= */

.mommas-bewitched video {

  position: absolute;

  top: 50%;
  left: 50%;

  width: 100%;
  height: 100%;

  transform:
    translate(-50%, -50%);

  object-fit: cover;

  object-position: center;

  background: #000;
}


/* =========================
   SOFT WITCHY OVERLAY
========================= */

.witchy-overlay {

  position: absolute;

  inset: 0;

  pointer-events: none;

  z-index: 2;

  background:

    radial-gradient(
      circle at center,
      transparent 45%,
      rgba(0,0,0,.18) 100%
    );

}


/* =========================
   MAGICAL SPARKLES
========================= */

.magic {

  position: absolute;

  z-index: 3;

  pointer-events: none;

  width: 4px;
  height: 4px;

  border-radius: 50%;

  background: white;

  box-shadow:

    0 0 5px white,
    0 0 10px #e2b6ff,
    0 0 18px #a850e8;

  opacity: 0;

  animation:
    floatMagic linear forwards;
}


/* =========================
   MAGIC ANIMATION
========================= */

@keyframes floatMagic {

  0% {

    transform:
      translateY(20px)
      scale(.3);

    opacity: 0;

  }

  20% {

    opacity: .9;

  }

  70% {

    opacity: .7;

  }

  100% {

    transform:
      translateY(-150px)
      translateX(var(--move))
      scale(1.3);

    opacity: 0;

  }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

  .mommas-bewitched video {

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

  }

}


/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

  .magic {

    display: none;

  }

}

</style>

</head>


<body>


<div
  class="mommas-bewitched"
  id="mommasBewitched"
>


  <!-- =====================
       MOMMAS BEWITCHED VIDEO
  ====================== -->

  <video
    id="mommasVideo"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto"
  >

    <source
      src="index.MP4"
      type="video/mp4"
    >

    Your browser does not support HTML5 video.

  </video>


  <!-- WITCHY OVERLAY -->

  <div
    class="witchy-overlay"
  ></div>


</div>



<script>

/* =========================
   GET ELEMENTS
========================= */

const container =
  document.getElementById(
    "mommasBewitched"
  );

const video =
  document.getElementById(
    "mommasVideo"
  );


/* =========================
   FORCE VIDEO PLAY
========================= */

function startVideo() {

  if (!video) return;

  video.muted = true;

  const playPromise =
    video.play();

  if (
    playPromise !== undefined
  ) {

    playPromise.catch(
      function () {

        console.log(
          "Waiting for browser autoplay permission."
        );

      }
    );

  }

}


/* TRY WHEN PAGE LOADS */

window.addEventListener(
  "load",
  startVideo
);


/* TRY WHEN VIDEO IS READY */

video.addEventListener(
  "canplay",
  startVideo
);


/* TRY AGAIN AFTER TAP */

document.addEventListener(
  "touchstart",
  startVideo,
  {
    once: true
  }
);


/* TRY AGAIN AFTER CLICK */

document.addEventListener(
  "click",
  startVideo,
  {
    once: true
  }
);


/* =========================
   CREATE MAGIC PARTICLES
========================= */

function createMagic() {

  if (!container) return;

  const sparkle =
    document.createElement(
      "span"
    );

  sparkle.className =
    "magic";


  /* RANDOM SIZE */

  const size =
    2 +
    Math.random() * 5;

  sparkle.style.width =
    size + "px";

  sparkle.style.height =
    size + "px";


  /* RANDOM POSITION */

  sparkle.style.left =
    (
      5 +
      Math.random() * 90
    ) + "%";

  sparkle.style.top =
    (
      45 +
      Math.random() * 50
    ) + "%";


  /* RANDOM MOVEMENT */

  sparkle.style.setProperty(

    "--move",

    (
      -50 +
      Math.random() * 100
    ) + "px"

  );


  /* RANDOM SPEED */

  sparkle.style.animationDuration =

    (
      3 +
      Math.random() * 4
    ) + "s";


  container.appendChild(
    sparkle
  );


  /* REMOVE AFTER ANIMATION */

  setTimeout(

    function () {

      sparkle.remove();

    },

    7500

  );

}


/* =========================
   CONTINUOUS MAGIC
========================= */

setInterval(

  createMagic,

  550

);


/* =========================
   EXTRA MAGIC WHEN TAPPED
========================= */

container.addEventListener(

  "click",

  function () {

    for (
      let i = 0;
      i < 15;
      i++
    ) {

      setTimeout(

        createMagic,

        i * 40

      );

    }

  }

);


/* =========================
   PAGE VISIBILITY
   Restart video when visitor
   returns to page
========================= */

document.addEventListener(

  "visibilitychange",

  function () {

    if (
      !document.hidden
    ) {

      startVideo();

    }

  }

);

</script>


</body>

</html>
